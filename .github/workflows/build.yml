name: Build Native Library

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true

    - name: Build with NDK
      run: |
        cd module
        ndk-build

    - name: Prepare Artifact
      run: |
        mkdir -p output
        cp module/libs/arm64-v8a/*.so output/ 2>/dev/null || cp module/obj/local/arm64-v8a/*.so output/ 2>/dev/null

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustesp-native
        path: output/