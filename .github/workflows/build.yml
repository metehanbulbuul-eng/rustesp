name: Build ESP Module

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Clone and Build Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/dobby-src
          cd /tmp/dobby-src
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                -DCMAKE_BUILD_TYPE=Release \
                -DDOBBY_GENERATE_SHARED=OFF \
                -DDOBBY_GENERATE_STATIC=ON \
                ..
          make -j4
          find . -name "libdobby.a" -o -name "*.a" | head -20

      - name: Copy Dobby lib into project
        run: |
          mkdir -p module/jni/dobby
          find /tmp/dobby-src/build -name "libdobby.a" -exec cp {} module/jni/dobby/libdobby.a \;
          ls -la module/jni/dobby/

      - name: Build with ndk-build
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=./jni/Application.mk

      - name: Prepare Magisk Module
        run: |
          mkdir -p output/zygisk
          cp module/libs/arm64-v8a/libzygisk.so output/zygisk/arm64-v8a.so
          cp module/module.prop output/

      - name: Create module zip
        run: |
          cd output
          zip -r ../RustESP.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustESP-Module
          path: RustESP.zip